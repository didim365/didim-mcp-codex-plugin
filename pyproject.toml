[project]
name = "didim-mcp-codex-plugin"
version = "0.3.0"
description = "Didim MCP Codex Plugin + Dynamic Skill Registry (FastAPI + React Admin)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "didim365" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    # `/logout` 이 form POST 를 받는다(통합 로그아웃 체인은 브라우저 내비게이션이어야
    # 하므로 fetch 로 대체할 수 없다). FastAPI 의 Form() 이 이것을 요구한다.
    "python-multipart>=0.0.9",
    # DIDIM Access JWT 검증 전용(발급하지 않는다). RS256 + JWKS 에 cryptography 가 필요하다.
    "pyjwt[crypto]>=2.9",
    # 웹 세션 쿠키(서명). didim-mcp-service-backend 와 같은 방식.
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG002", "ARG001"]
# Alembic 이 호출하는 콜백 시그니처는 고정이라 인자를 다 쓰지 않는다.
"alembic/env.py" = ["ARG001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 실제 PostgreSQL 이 필요한 테스트",
]
